name: close-issues

# Одноразовый: закрывает отладочные issues «Сборка упала…» (интерактивному
# боту такие права не выданы, а Actions-токен имеет). При неудаче создаёт
# диагностический issue. Удалить после использования.
on:
  push:
    tags:
      - 'vtest-close*'

permissions:
  issues: write
  contents: read

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close debug issues
        run: |
          OUT=/tmp/close.log
          : > "$OUT"
          NUMS=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null and (.title | startswith("Сборка упала"))) | .number')
          echo "найдены: $NUMS" >> "$OUT"
          FAILED=0
          for n in $NUMS; do
            echo "== issue $n" >> "$OUT"
            gh issue comment "$n" \
              --body "Отработал: ошибка была найдена и исправлена в ходе настройки CI (см. коммиты ветки). Закрываю автоматически." \
              >> "$OUT" 2>&1 || true
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/$n" \
              -f state=closed -f state_reason=completed >> "$OUT" 2>&1 \
              || { echo "FAIL rc=$?" >> "$OUT"; FAILED=1; }
          done
          if [ "$FAILED" = "1" ]; then
            echo "=== gh auth ===" >> "$OUT"
            gh auth status >> "$OUT" 2>&1 || true
            gh issue create --title "close-issues: ошибка" --body-file "$OUT" || cat "$OUT"
          fi
          echo "готово, failed=$FAILED"
        env:
          GH_TOKEN: ${{ github.token }}
