name: Сборка APK

# Автосборка приложения: на каждый пуш и пул-реквест собирает release-APK,
# прогоняет тесты и выкладывает готовый APK артефактом.
#
# Где забрать APK: Actions -> нужный запуск -> Artifacts ->
#                 ZIOffice-<версия>-<commit>.zip
#
# Если сборка сломалась — в шаге «Итог» есть хвост лога, а также создаётся
# issue с текстом ошибки.

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/tools.zip
          unzip -q -o /tmp/tools.zip -d "$ANDROID_HOME/cmdline-tools"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Память Gradle (CI)
        run: |
          sed -i 's/-Xmx512m/-Xmx3g/' gradle.properties
          sed -i 's/-XX:MaxMetaspaceSize=256m/-XX:MaxMetaspaceSize=768m/' gradle.properties

      - name: Сборка APK + тесты
        run: |
          set -o pipefail
          java -version 2>&1 | tee build.log
          echo "ANDROID_HOME=$ANDROID_HOME" >> build.log
          cat gradle.properties | tee -a build.log
          echo "================ GRADLE ================" >> build.log
          ./gradlew assembleRelease testReleaseUnitTest --no-daemon --stacktrace 2>&1 | tee -a build.log

      - name: Версия и имя APK
        id: ver
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | head -1 || true)
          VN=""
          if [ -n "$AAPT" ]; then
            VN=$("$AAPT" dump badging "$APK" 2>/dev/null | grep -oP "versionName='\K[^']+" | head -1 || true)
          fi
          if [ -z "$VN" ]; then
            VN=$(grep -oP '^def appVersionName = "\K[^"]+' app/build.gradle | head -1 || true)
          fi
          echo "version=${VN:-unknown}" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "Версия в APK: ${VN:-не определена}"

      - name: Проверка APK
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | head -1 || true)
          INFO=$("$AAPT" dump badging "$APK" | head -1 || true)
          VCODE=$(echo "$INFO" | grep -oP "versionCode='\K[^']+" || true)
          VNAME=$(echo "$INFO" | grep -oP "versionName='\K[^']+" || true)
          SIZE=$(du -h "$APK" | cut -f1)
          echo "APK версия $VNAME (код $VCODE), размер $SIZE"
          unzip -l "$APK" | grep -q "assets/tessdata/rus.traineddata" || { echo "::error::в APK нет модели OCR"; exit 1; }
          unzip -p "$APK" assets/viewer.html | grep -q "MAX_ROWS" || { echo "::error::в APK старая версия viewer.html"; exit 1; }
          unzip -p "$APK" classes.dex | grep -q "assets/viewer.html" || true
          echo "::notice::APK проверен — версия $VNAME (код $VCODE), размер $SIZE"

      - name: Выложить APK артефактом
        uses: actions/upload-artifact@v7
        with:
          name: ZIOffice-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.short }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # Хвост лога прямо в job summary — видно на github.com без скачивания
      - name: Итог
        if: always()
        run: |
          {
            echo "## Сборка ZI Office"
            echo ""
            echo "- версия: ${{ steps.ver.outputs.version }}"
            echo "- коммит: ${{ steps.ver.outputs.short }}"
            echo ""
            echo "### Хвост лога сборки"
            echo '```'
            tail -n 120 build.log 2>/dev/null || echo "лог не сохранён"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Если сборка упала — issue с хвостом лога (удобно читать и чинить)
      - name: Сообщить об ошибке (issue)
        if: failure()
        run: |
          {
            echo "## Ошибка сборки"
            echo ""
            echo "Коммит: $(git rev-parse HEAD)"
            echo "Ветка: ${GITHUB_REF_NAME}"
            echo ""
            echo '```'
            tail -c 40000 build.log 2>/dev/null || echo "лог не сохранён"
            echo '```'
          } > /tmp/failbody.md
          gh issue create --title "Сборка упала: $(git rev-parse --short HEAD)" --body-file /tmp/failbody.md || echo "issue не создан"
        env:
          GH_TOKEN: ${{ github.token }}
