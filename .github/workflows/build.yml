name: Проверка сборки

# Компилирует проект, чтобы ловить ошибки до релиза:
#  - на пулы в main,
#  - на пуши в ветки arena/* (рабочие ветки),
#  - вручную (Actions -> Проверка сборки -> Run workflow).

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ 'arena/**' ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/tools.zip
          unzip -q -o /tmp/tools.zip -d "$ANDROID_HOME/cmdline-tools"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle memory (CI)
        run: |
          sed -i 's/-Xmx512m/-Xmx3g/' gradle.properties
          sed -i 's/-XX:MaxMetaspaceSize=256m/-XX:MaxMetaspaceSize=768m/' gradle.properties

      - name: Build (compile check)
        run: |
          set -o pipefail
          java -version 2>&1 | tee build.log
          echo "ANDROID_HOME=$ANDROID_HOME" >> build.log
          ls "$ANDROID_HOME" 2>&1 | tee -a build.log
          cat gradle.properties | tee -a build.log
          echo "================ GRADLE ================" >> build.log
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee -a build.log || { echo "GRADLE_EXIT=$?" >> build.log; exit 1; }

      # Хвост лога в job summary — видно в UI на github.com
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Build log (tail)"
            echo '```'
            tail -n 150 build.log 2>/dev/null || echo "лог не сохранён"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Если сборка упала, создаёт issue с хвостом лога (удобно читать/чинить)
      - name: Report failure (issue)
        if: failure()
        run: |
          {
            echo "## Ошибка сборки"
            echo ""
            echo "Коммит: $(git rev-parse HEAD)"
            echo ""
            echo '```'
            tail -c 40000 build.log 2>/dev/null || echo "лог не сохранён"
            echo '```'
          } > /tmp/failbody.md
          gh issue create --title "Сборка упала: $(git rev-parse --short HEAD)" --body-file /tmp/failbody.md || echo "issue не создан"
        env:
          GH_TOKEN: ${{ github.token }}
