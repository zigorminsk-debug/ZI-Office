name: reltest

on:
  push:
    tags:
      - 'vtest-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Номер версии (совпадает с versionName, напр. 2.24)'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  j:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_REPO: ${{ vars.RELEASE_REPO || 'zigorminsk-debug/ZI-Office-Release' }}
    steps:
      - run: echo ok
