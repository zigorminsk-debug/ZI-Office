name: reltest

on:
  push:
    tags:
      - 'vtest-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Номер версии (совпадает с versionName, напр. 2.24)'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  j:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_REPO: ${{ vars.RELEASE_REPO || 'zigorminsk-debug/ZI-Office-Release' }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - name: Check release token
        if: ${{ env.RELEASE_TOKEN == '' }}
        run: echo ok
      - name: Publish GitHub Release
        if: ${{ env.RELEASE_TOKEN != '' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASE_REPO }}
          token: ${{ env.RELEASE_TOKEN }}
          tag_name: v1
          name: test
