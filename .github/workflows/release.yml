name: Релиз APK

# Выпуск версии (это то, что видят пользователи приложения как обновление):
#  1) собирает release-APK с номером версии из тега,
#  2) выкладывает APK артефактом,
#  3) публикует GitHub Release с APK — оттуда приложение само предлагает обновление.
#
# Как выпустить версию:
#   git tag v2.24 && git push origin v2.24
#   (или Actions -> «Релиз APK» -> Run workflow и указать номер версии)
#
# Номер версии в APK берётся из тега/поля ввода, а versionCode считается из него
# автоматически (2.24 -> 20400) — версия заведомо новее предыдущей, поэтому
# Android спокойно ставит обновление поверх.
#
# Одноразовая настройка публичного репозитория релизов и секрета RELEASE_TOKEN —
# см. АВТООБНОВЛЕНИЕ.md. Если секрета нет, релиз публикуется здесь (в приватном
# репозитории) — APK будет доступен, но автообновление у клиентов не сработает,
# потому что приватный репозиторий приложению недоступен.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Номер версии (например 2.24). Пусто — взять из app/build.gradle'
        required: false
        default: ''

permissions:
  contents: write

env:
  RELEASE_REPO: ${{ vars.RELEASE_REPO || 'zigorminsk-debug/ZI-Office-Release' }}
  RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/tools.zip
          unzip -q -o /tmp/tools.zip -d "$ANDROID_HOME/cmdline-tools"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Память Gradle (CI)
        run: |
          sed -i 's/-Xmx512m/-Xmx3g/' gradle.properties
          sed -i 's/-XX:MaxMetaspaceSize=256m/-XX:MaxMetaspaceSize=768m/' gradle.properties

      - name: Номер версии
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -e
          BASE=$(grep -oP '^def appVersionName = "\K[^"]+' app/build.gradle | head -1 || true)
          if [ -z "$BASE" ]; then echo "::error::не найден номер версии в app/build.gradle (строка: def appVersionName = \"...\")"; exit 1; fi
          VN="$BASE"
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then VN="$INPUT_VERSION"; fi
          if [ "$EVENT" = "push" ]; then VN="$REF_NAME"; fi
          VN="${VN#v}"
          if [ -z "$VN" ]; then echo "::error::пустой номер версии"; exit 1; fi
          if [ "$EVENT" = "push" ] && [ "$VN" != "$BASE" ]; then
            echo "::warning::Тег v$VN не совпадает с versionName $BASE в app/build.gradle — собираем как $VN"
          fi
          echo "version=$VN" >> "$GITHUB_OUTPUT"
          echo "Собираем версию: $VN"

      - name: Сборка release APK
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease -PversionName="$VERSION" --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Переименовать APK
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: cp app/build/outputs/apk/release/app-release.apk "ZIOffice-$VERSION.apk"

      - name: Описание релиза
        id: notes
        run: |
          set -e
          {
            echo "## ZI Office v${{ steps.ver.outputs.version }}"
            echo ""
            echo "Установите APK поверх текущей версии — подпись та же, данные сохраняются."
            echo ""
            echo "### Изменения"
            echo ""
            PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            if [ -n "$PREV" ]; then
              git log "$PREV..HEAD" --no-merges --pretty='- %s' | head -40
            else
              git log -n 12 --no-merges --pretty='- %s' | head -12
            fi
          } > "$RUNNER_TEMP/NOTES.md"
          echo "body_file=$RUNNER_TEMP/NOTES.md" >> "$GITHUB_OUTPUT"

      - name: APK артефактом
        uses: actions/upload-artifact@v7
        with:
          name: ZIOffice-${{ steps.ver.outputs.version }}
          path: ZIOffice-${{ steps.ver.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 90

      - name: Публикация релиза (публичный репозиторий обновлений)
        if: ${{ env.RELEASE_TOKEN != '' }}
        uses: softprops/action-gh-release@v3
        with:
          repository: ${{ env.RELEASE_REPO }}
          token: ${{ env.RELEASE_TOKEN }}
          tag_name: v${{ steps.ver.outputs.version }}
          name: ZI Office v${{ steps.ver.outputs.version }}
          body_path: ${{ runner.temp }}/NOTES.md
          files: ZIOffice-${{ steps.ver.outputs.version }}.apk
          draft: false
          prerelease: false

      - name: Нет RELEASE_TOKEN
        if: ${{ env.RELEASE_TOKEN == '' }}
        run: echo "::warning::Не задан секрет RELEASE_TOKEN — релиз будет создан в этом приватном репозитории, и автообновление у пользователей НЕ сработает. Инструкция: АВТООБНОВЛЕНИЕ.md"

      - name: Публикация релиза в этом репозитории (если нет RELEASE_TOKEN)
        if: ${{ env.RELEASE_TOKEN == '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: ZI Office v${{ steps.ver.outputs.version }}
          body_path: ${{ runner.temp }}/NOTES.md
          files: ZIOffice-${{ steps.ver.outputs.version }}.apk
          draft: false
          prerelease: false

      - name: Итог
        if: always()
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          {
            echo "## Релиз ZI Office v${VERSION}"
            echo ""
            echo "- APK: артефакт «ZIOffice-${VERSION}» (внизу страницы запуска)"
            if [ -n "$RELEASE_TOKEN" ]; then
              echo "- релиз опубликован в публичном репозитории: https://github.com/${RELEASE_REPO}/releases"
              echo "- автообновление у пользователей заработает при следующем запуске приложения"
            else
              echo "- ⚠️ секрет RELEASE_TOKEN не задан: релиз создан здесь, автообновление работать НЕ будет"
              echo ""
              echo "Что сделать один раз (5 минут), подробно — в АВТООБНОВЛЕНИЕ.md:"
              echo "1. создать публичный репозиторий для APK (по умолчанию ${RELEASE_REPO});"
              echo "2. выпустить токен с правом Contents: Read and write на этот репозиторий;"
              echo "3. положить его в Settings → Secrets and variables → Actions как RELEASE_TOKEN."
            fi
            echo ""
            if [ -f build.log ]; then
              echo "### Хвост лога сборки"
              echo '```'
              tail -n 40 build.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
